<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片合併工具</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --ink: #1a1a1a;
            --paper: #f5f0e8;
            --cream: #ede8dc;
            --accent: #c0392b;
            --accent-soft: rgba(192, 57, 43, 0.1);
            --border: #c8bfaa;
            --muted: #7a6f60;
            --card: #faf7f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            padding: 48px 24px;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(192,57,43,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(192,57,43,0.03) 0%, transparent 50%);
        }

        .wrap { max-width: 960px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 48px; }
        header h1 { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
        header h1 span { color: var(--accent); }
        header p { margin-top: 10px; font-size: 15px; color: var(--muted); }
        .divider { width: 60px; height: 2px; background: var(--accent); margin: 16px auto 0; }

        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 32px 36px;
            margin-bottom: 24px;
            position: relative;
        }

        /* 根據需求，將標題字體從 12px 放大至 14px */
        .section-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px; 
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 44px 32px;
            text-align: center;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
        .upload-icon { font-size: 40px; margin-bottom: 12px; display: block; }

        .btn {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            border: none; cursor: pointer; font-size: 14px; font-weight: 600;
            border-radius: 3px; padding: 12px 26px; transition: all 0.2s;
        }
        .btn-outline { background: white; color: var(--accent); border: 1.5px solid var(--accent); }
        .btn-outline:hover { background: var(--accent); color: white; }
        .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
        .btn-ghost:hover { background: var(--cream); color: var(--ink); }
        .btn-primary { background: var(--accent); color: white; font-size: 16px; padding: 16px 40px; width: 100%; }
        .btn-primary:hover { background: #a93226; transform: translateY(-1px); }
        
        .preview-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; min-height: 20px;}
        .chip {
            background: white; border: 1px solid var(--border); border-radius: 3px;
            padding: 6px 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;
            cursor: grab; transition: transform 0.1s;
        }
        .chip:active { cursor: grabbing; }
        .chip-remove { background: none; border: none; cursor: pointer; color: #aaa; padding: 0; font-size: 14px;}
        .chip-remove:hover { color: var(--accent); }

        .setting-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; margin-bottom: 16px;}
        .option-card { border: 2px solid var(--border); border-radius: 4px; padding: 12px 8px; text-align: center; cursor: pointer; background: white; transition: 0.2s; }
        .option-card:hover, .option-card.active { border-color: var(--accent); background: var(--accent-soft); }
        .option-card.active .option-label { color: var(--accent); }
        .option-card.disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        .option-label { font-size: 12px; font-weight: 600; display: block; margin-top: 4px;}

        .icon-mock { width: 30px; height: 30px; margin: 0 auto 8px; display: grid; gap: 2px; }
        .icon-mock span { background: var(--border); border-radius: 1px; }
        .option-card.active .icon-mock span { background: var(--accent); }

        .control-row { display: flex; align-items: center; gap: 16px; background: white; padding: 12px 16px; border: 1px solid var(--border); border-radius: 4px; }
        .control-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
        .range-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
        .range-wrap.locked { opacity: 0.3; pointer-events: none; }
        input[type="range"] { flex: 1; accent-color: var(--accent); }

        .canvas-container { background: #e2e8f0; border-radius: 4px; padding: 20px; text-align: center; margin-top: 24px; overflow: hidden;}
        canvas { max-width: 100%; height: auto; box-shadow: 0 4px 18px rgba(0,0,0,0.1); background: #fff; }

        .quality-box { text-align: center; margin: 20px 0; font-size: 14px; }
        .quality-box label { margin: 0 10px; cursor: pointer; }
        .quality-box input { accent-color: var(--accent); margin-right: 4px; }

        #rem-count { font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>圖片<span> 合併工具</span></h1>
        <p>自訂排版、比例與邊框，本地快速合成不傷畫質</p>
        <div class="divider"></div>
    </header>

    <div class="section">
        <div class="section-label">1. 上傳圖片 (上限 9 張，目前剩餘 <span id="rem-count">9</span>)</div>
        <div class="upload-zone" id="drop-zone">
            <span class="upload-icon">🖼️</span>
            <p>拖曳圖片至此，或點擊按鈕選取</p>
            <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">選取圖片</button>
            <button class="btn btn-ghost" id="clear-btn" style="display:none; margin-left: 8px;" onclick="clearAll()">✕ 清空</button>
        </div>
        <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
        <div id="preview-list" class="preview-list"></div>
    </div>

    <div class="section">
        <div class="section-label">2. 選擇排版</div>
        <div class="setting-grid" id="layout-selector">
            <div class="option-card active" data-layout="smart" data-min="1">
                <div class="icon-mock" style="grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;"><span></span><span></span><span></span><span></span></div>
                <span class="option-label">自動</span>
            </div>
            <div class="option-card" data-layout="vertical" data-min="1">
                <div class="icon-mock" style="grid-template-columns: 1fr;"><span></span><span></span><span></span></div>
                <span class="option-label">直向</span>
            </div>
            <div class="option-card" data-layout="horizontal" data-min="1">
                <div class="icon-mock" style="grid-template-columns: 1fr 1fr 1fr;"><span></span><span></span><span></span></div>
                <span class="option-label">橫向</span>
            </div>
            <div class="option-card" data-layout="2x2" data-min="4">
                <div class="icon-mock" style="grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;"><span></span><span></span><span></span><span></span></div>
                <span class="option-label">2x2</span>
            </div>
            <div class="option-card" data-layout="3x2" data-min="6">
                <div class="icon-mock" style="grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr;"><span></span><span></span><span></span><span></span><span></span><span></span></div>
                <span class="option-label">3x2</span>
            </div>
            <div class="option-card" data-layout="3x3" data-min="9">
                <div class="icon-mock" style="grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
                <span class="option-label">3x3</span>
            </div>
        </div>

        <div class="section-label" style="margin-top: 24px;">3. 圖片比例</div>
        <div class="setting-grid" id="ratio-selector">
            <div class="option-card active" data-ratio="auto"><span class="option-label">✨ 自適應</span></div>
            <div class="option-card" data-ratio="1:1"><span class="option-label">1:1</span></div>
            <div class="option-card" data-ratio="16:9"><span class="option-label">16:9</span></div>
            <div class="option-card" data-ratio="9:16"><span class="option-label">9:16</span></div>
            <div class="option-card" data-ratio="4:3"><span class="option-label">4:3</span></div>
        </div>
    </div>

    <div class="section">
        <div class="section-label">4. 邊框與輸出</div>
        <div class="control-row">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap;">
                <input type="checkbox" id="add-border" checked> 加上白框
            </label>
            <div class="range-wrap" id="border-ctrl-group">
                <input type="range" id="border-width" min="0" max="100" value="15">
                <span style="font-size: 13px; font-weight: bold; width: 40px;"><span id="border-width-val">15</span>px</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <div class="quality-box">
            <label><input type="radio" name="quality" value="1.0" checked> 原畫 (PNG)</label>
            <label><input type="radio" name="quality" value="0.6"> 中等 (JPG)</label>
        </div>

        <button class="btn btn-primary" onclick="downloadImage()">⬇ 下載合併圖片</button>
    </div>
</div>

<script>
    // 保留原本的功能邏輯代碼...
    document.addEventListener('contextmenu', e => e.preventDefault());

    let imagesArray = []; 
    const MAX_IMAGES = 9;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const previewList = document.getElementById('preview-list');
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    const sortable = new Sortable(previewList, {
        animation: 150,
        onEnd: () => {
            const newOrder = [];
            previewList.querySelectorAll('.chip').forEach(item => {
                const id = item.dataset.id;
                const imgObj = imagesArray.find(obj => obj.id == id);
                if (imgObj) newOrder.push(imgObj);
            });
            imagesArray = newOrder;
            drawCanvas();
        }
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => dropZone.addEventListener(n, e => { e.preventDefault(); e.stopPropagation(); }));
    dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
    dropZone.addEventListener('dragenter', () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    fileInput.onchange = (e) => handleFiles(e.target.files);

    function handleFiles(files) {
        const incoming = Array.from(files).filter(f => f.type.startsWith('image/'));
        const allowCount = MAX_IMAGES - imagesArray.length;
        incoming.slice(0, allowCount).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const id = "img_" + Date.now() + Math.random();
                    imagesArray.push({ id, img, name: file.name });
                    addChip(id, file.name);
                    updateUI();
                    drawCanvas();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
        fileInput.value = ""; 
    }

    function addChip(id, name) {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.dataset.id = id;
        chip.innerHTML = `<span>${name}</span><button class="chip-remove" onclick="removeImage('${id}')">✕</button>`;
        previewList.appendChild(chip);
    }

    function removeImage(id) {
        imagesArray = imagesArray.filter(item => item.id !== id);
        const target = previewList.querySelector(`[data-id="${id}"]`);
        if (target) target.remove();
        updateUI();
        drawCanvas();
    }

    function updateUI() {
        const count = imagesArray.length;
        document.getElementById('rem-count').innerText = MAX_IMAGES - count;
        document.getElementById('clear-btn').style.display = count > 0 ? 'inline-block' : 'none';
        document.querySelectorAll('.option-card[data-layout]').forEach(btn => {
            const min = parseInt(btn.dataset.min);
            if (count < min && btn.dataset.layout !== 'smart') {
                btn.classList.add('disabled');
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    document.querySelector('[data-layout="smart"]').classList.add('active');
                }
            } else { btn.classList.remove('disabled'); }
        });
    }

    function clearAll() {
        if (confirm("清空所有圖片？")) {
            imagesArray = []; previewList.innerHTML = ''; updateUI(); drawCanvas();
        }
    }

    function drawCanvas() {
        if (imagesArray.length === 0) { canvas.width = canvas.height = 0; return; }
        const layout = document.querySelector('.option-card.active[data-layout]').dataset.layout;
        const ratioMode = document.querySelector('.option-card.active[data-ratio]').dataset.ratio;
        const hasBorder = document.getElementById('add-border').checked;
        const borderWidth = hasBorder ? parseInt(document.getElementById('border-width').value) : 0;
        let cellW, cellH;
        if (ratioMode === 'auto') {
            cellW = Math.max(...imagesArray.map(obj => obj.img.width));
            cellH = Math.max(...imagesArray.map(obj => obj.img.height));
            const limit = 1200;
            if (cellW > limit || cellH > limit) {
                const s = Math.min(limit / cellW, limit / cellH);
                cellW *= s; cellH *= s;
            }
        } else {
            const [rw, rh] = ratioMode.split(':').map(Number);
            cellW = 800; cellH = (800 / rw) * rh;
        }
        let cols, rows;
        const n = imagesArray.length;
        if (layout === 'vertical') { cols = 1; rows = n; }
        else if (layout === 'horizontal') { cols = n; rows = 1; }
        else if (layout === '2x2') { cols = 2; rows = 2; }
        else if (layout === '3x2') { cols = 3; rows = 2; }
        else if (layout === '3x3') { cols = 3; rows = 3; }
        else { cols = Math.ceil(Math.sqrt(n)); rows = Math.ceil(n / cols); }
        canvas.width = (cols * cellW) + ((cols + 1) * borderWidth);
        canvas.height = (rows * cellH) + ((rows + 1) * borderWidth);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        imagesArray.slice(0, cols * rows).forEach((obj, i) => {
            const img = obj.img;
            const c = i % cols;
            const r = Math.floor(i / cols);
            const x = borderWidth + c * (cellW + borderWidth);
            const y = borderWidth + r * (cellH + borderWidth);
            let drawW, drawH, drawX, drawY;
            if (ratioMode === 'auto') {
                const s = Math.min(cellW / img.width, cellH / img.height);
                drawW = img.width * s; drawH = img.height * s;
            } else {
                const s = Math.max(cellW / img.width, cellH / img.height);
                drawW = img.width * s; drawH = img.height * s;
            }
            drawX = x + (cellW - drawW) / 2;
            drawY = y + (cellH - drawH) / 2;
            ctx.save();
            ctx.beginPath(); ctx.rect(x, y, cellW, cellH); ctx.clip();
            ctx.drawImage(img, drawX, drawY, drawW, drawH);
            ctx.restore();
        });
    }

    function downloadImage() {
        if (imagesArray.length === 0) return;
        const now = new Date();
        const timestamp = now.toISOString().replace(/[:T-]/g, '').slice(0, 14);
        const q = document.querySelector('input[name="quality"]:checked').value;
        const ext = q === "1.0" ? 'png' : 'jpg';
        const link = document.createElement('a');
        link.download = `merged-${timestamp}.${ext}`;
        link.href = canvas.toDataURL(q === "1.0" ? 'image/png' : 'image/jpeg', parseFloat(q));
        link.click();
    }

    document.getElementById('add-border').onchange = function() {
        document.getElementById('border-ctrl-group').classList.toggle('locked', !this.checked);
        drawCanvas();
    };
    document.getElementById('border-width').oninput = function() {
        document.getElementById('border-width-val').innerText = this.value; drawCanvas();
    };
    document.querySelectorAll('.option-card').forEach(btn => {
        btn.onclick = function() {
            if (this.classList.contains('disabled')) return;
            this.parentElement.querySelectorAll('.active').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            drawCanvas();
        };
    });
</script>
</body>
</html>
