<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Tools - 影像工具箱</title>
    <style>
        :root {
            --ink: #1a1a1a;
            --paper: #f5f0e8;
            --cream: #ede8dc;
            --accent: #c0392b;
            --accent-soft: rgba(192, 57, 43, 0.1);
            --border: #c8bfaa;
            --muted: #7a6f60;
            --card: #faf7f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(192,57,43,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(192,57,43,0.03) 0%, transparent 50%);
        }

        .wrap { 
            max-width: 800px; 
            width: 100%;
            text-align: center; 
        }
        
        header { margin-bottom: 60px; }
        header h1 { 
            font-size: 48px; 
            font-weight: 700; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header h1 span { color: var(--accent); }
        header p { 
            margin-top: 15px; 
            font-size: 16px; 
            color: var(--muted); 
            letter-spacing: 1px;
        }
        .divider { width: 80px; height: 3px; background: var(--accent); margin: 24px auto 0; }

        /* 按鈕容器佈局 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        /* 工具卡片樣式 */
        .tool-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 40px 24px;
            text-decoration: none;
            color: var(--ink);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .tool-card:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(192, 57, 43, 0.1);
        }

        .tool-card::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tool-card:hover::after {
            transform: scaleX(1);
        }

        .tool-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .tool-name {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .tool-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 36px; }
            .tools-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-EZTW98Q8GK"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-EZTW98Q8GK');
</script> 

<body>

<div class="wrap">
    <header>
        <div class="label">COLLECTION</div>
        <h1>PHOTO <span>TOOLS</span></h1>
        <p>影像處理工具集</p>
        <div class="divider"></div>
    </header>

    <div class="tools-grid">
        <a href="Photo_Combine.html" class="tool-card">
            <span class="tool-icon">🖼️</span>
            <span class="tool-name">Photo_Combine</span>
            <span class="tool-desc">自定義比例圖片合併工具</span>
        </a>

        <a href="Photo_to_PDF.html" class="tool-card">
            <span class="tool-icon">📄</span>
            <span class="tool-name">Photo_to_PDF</span>
            <span class="tool-desc">將多張照片轉換為 PDF 檔案</span>
        </a>

        <a href="HEIC_to_JPEG.html" class="tool-card">
            <span class="tool-icon">📸</span>
            <span class="tool-name">HEIC_to_JPEG</span>
            <span class="tool-desc">高效 HEIC 格式轉 JPEG 處理</span>
        </a>
    </div>

    <footer style="margin-top: 80px; font-family: 'Courier New', monospace; font-size: 12px; color: var(--muted); letter-spacing: 1px;">
        &copy; 2026 PHOTO TOOLS UTILITY. ALL RIGHTS RESERVED.
    </footer>
</div>

</body>
</html>
