<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片轉 PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <style>
        :root {
            --ink: #1a1a1a;
            --paper: #f5f0e8;
            --cream: #ede8dc;
            --accent: #c0392b;
            --accent-soft: rgba(192, 57, 43, 0.1);
            --border: #c8bfaa;
            --muted: #7a6f60;
            --card: #faf7f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            background-color: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            padding: 48px 24px;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(192,57,43,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(192,57,43,0.03) 0%, transparent 50%);
        }

        .wrap { max-width: 960px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 48px; }
        header h1 { font-size: 42px; font-weight: 700; letter-spacing: -1px; }
        header h1 span { color: var(--accent); }
        header p { margin-top: 10px; font-size: 15px; color: var(--muted); }
        .divider { width: 60px; height: 2px; background: var(--accent); margin: 16px auto 0; }

        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 32px 36px;
            margin-bottom: 24px;
            position: relative;
        }

        .section-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .title-input {
            width: 100%;
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            font-size: 22px;
            font-weight: 600;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            padding: 8px 4px;
            outline: none;
            transition: border-color 0.2s;
        }
        .title-input:focus { border-bottom-color: var(--accent); }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 4px;
            padding: 44px 32px;
            text-align: center;
            cursor: pointer;
            background: rgba(255,255,255,0.4);
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
        .upload-icon { font-size: 40px; margin-bottom: 12px; display: block; }

        .btn {
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            border: none; cursor: pointer; font-size: 14px; font-weight: 600;
            border-radius: 3px; padding: 12px 26px; transition: all 0.2s;
        }
        .btn-outline { background: white; color: var(--accent); border: 1.5px solid var(--accent); }
        .btn-outline:hover { background: var(--accent); color: white; }
        .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
        .btn-ghost:hover { background: var(--cream); color: var(--ink); }
        .btn-primary { background: var(--accent); color: white; font-size: 16px; padding: 16px 40px; width: 100%; }
        .btn-primary:hover { background: #a93226; transform: translateY(-1px); }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }

        /* 檔案標籤與拖曳效果 */
        .file-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .chip {
            background: white; border: 1px solid var(--border); border-radius: 3px;
            padding: 6px 12px; font-size: 13px; display: flex; align-items: center; gap: 8px;
            cursor: grab; transition: transform 0.1s, box-shadow 0.1s;
            position: relative;
        }
        .chip:active { cursor: grabbing; }
        .chip.dragging { opacity: 0.5; border-color: var(--accent); transform: scale(0.95); }
        
        /* 拖曳時顯示插入位置的光標指示 */
        .chip.drag-over-left { box-shadow: -4px 0 0 var(--accent); }
        .chip.drag-over-right { box-shadow: 4px 0 0 var(--accent); }

        .chip-remove { background: none; border: none; cursor: pointer; color: #aaa; padding: 0; }
        .chip-remove:hover { color: var(--accent); }
        .file-count { font-size: 13px; color: var(--muted); margin-top: 12px; }

        .layout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px;}
        .layout-card { border: 2px solid var(--border); border-radius: 4px; padding: 20px 16px; text-align: center; cursor: pointer; background: white; }
        .layout-card:hover, .layout-card.active { border-color: var(--accent); background: var(--accent-soft); }
        .layout-card.active .layout-label { color: var(--accent); }

        .layout-preview { display: grid; gap: 4px; width: 72px; height: 90px; margin: 0 auto 12px; padding: 6px; background: #f0ebe2; border: 1px solid var(--border); }
        .layout-preview .cell { background: var(--border); }
        .layout-preview.l2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .layout-preview.l4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .layout-preview.l6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .layout-label { font-size: 13px; font-weight: 600; }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }
        .toggle-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

        #status { text-align: center; font-size: 14px; color: var(--accent); min-height: 20px; font-weight: bold;}

        /* 預覽區 */
        .preview-pages { display: flex; flex-direction: column; gap: 24px; margin-top: 8px; }
        .page-wrap { display: flex; align-items: flex-start; gap: 20px; }
        .page-number { font-size: 12px; color: var(--muted); width: 36px; text-align: right; padding-top: 12px; font-weight: bold;}
        .page-mock { flex: 1; background: white; border: 1px solid var(--border); box-shadow: 0 4px 18px rgba(0,0,0,0.08); padding: 20px; }
        .page-title-bar { font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink); }
        
        .page-imgs { display: grid; gap: 8px; }
        /* 列數由 JS 依版面動態設定，使預覽貼近真實 PDF 排版 */
        
        .img-container {
            display: flex;
            flex-direction: column;
            background: #fafafa;
            border: 1px solid #eee;
            overflow: hidden;
        }
        
        /* 圖片格：寬高比與 PDF 儲存格一致，確保 contain 置中後的白邊與實際輸出相同 */
        .img-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
        }
        
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        .caption-input {
            width: 90%;
            margin-top: 8px;
            padding: 4px;
            text-align: center;
            font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
            font-size: 12px;
            border: 1px dashed #ccc;
            background: transparent;
            border-radius: 2px;
        }
        .caption-input:focus { border-color: var(--accent); outline: none; background: white; }

        .page-footer { font-size: 10px; color: #ccc; text-align: center; margin-top: 12px; }
    </style>
</head>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-EZTW98Q8GK"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-EZTW98Q8GK');

<body>

<div class="wrap">
    <header>
        <h1>圖片轉<span> PDF</span></h1>
        <p>支援 JPG・PNG・WEBP・HEIC・HEIF，本地處理不上傳，自訂排序與說明</p>
        <div class="divider"></div>
    </header>

    <div class="section">
        <div class="section-label">PDF 標題</div>
        <input class="title-input" id="pdfTitle" type="text" placeholder="輸入顯示於 PDF 最上方的標題…">
    </div>

    <div class="section">
        <div class="section-label">選取圖片 (可拖曳標籤改變排序)</div>
        <div class="upload-zone" id="dropZone">
            <span class="upload-icon">📂</span>
            <p>拖曳圖片至此，或點擊按鈕選取</p>
            <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">選取圖片</button>
            <br><br>
            <small style="color:#aaa;">JPG · PNG · WEBP · HEIC · HEIF　最多 100 張</small>
        </div>
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.heic,.heif" multiple>
        <div class="file-chips" id="fileChips"></div>
        <div class="file-count" id="fileCount"></div>
    </div>

    <div class="section">
        <div class="section-label">版面與內容設定</div>
        <div class="layout-grid">
            <div class="layout-card active" data-layout="2">
                <div class="layout-preview l2"><div class="cell"></div><div class="cell"></div></div>
                <div class="layout-label">直列兩張</div>
            </div>
            <div class="layout-card" data-layout="4">
                <div class="layout-preview l4"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
                <div class="layout-label">四宮格</div>
            </div>
            <div class="layout-card" data-layout="6">
                <div class="layout-preview l6"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
                <div class="layout-label">六宮格</div>
            </div>
        </div>
        <label class="toggle-group">
            <input type="checkbox" id="enableCaptionCheck"> 
            在圖片下方添加圖片編號與文字說明 (可在下方預覽區直接修改)
        </label>
    </div>

    <div class="section">
        <div style="display: flex; gap: 12px; margin-bottom: 12px;">
            <button class="btn btn-ghost" id="clearBtn">✕ 清除全部</button>
        </div>
        <button class="btn btn-primary" id="generateBtn">⬇ 產生並下載 PDF</button>
        <br><br>
        <div id="status"></div>
    </div>

    <div class="section" id="previewSection" style="display:none;">
        <div class="section-label">預覽與編輯</div>
        <div class="preview-pages" id="previewPages"></div>
    </div>
</div>

<script>
const { jsPDF } = window.jspdf;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileChips = document.getElementById('fileChips');
const fileCount = document.getElementById('fileCount');
const clearBtn = document.getElementById('clearBtn');
const generateBtn = document.getElementById('generateBtn');
const statusEl = document.getElementById('status');
const previewSection = document.getElementById('previewSection');
const previewPages = document.getElementById('previewPages');
const pdfTitleInput = document.getElementById('pdfTitle');
const enableCaptionCheck = document.getElementById('enableCaptionCheck');

let fileItems = []; 
let currentLayout = 2; 

// 拖放事件設定 (上傳區)
['dragenter','dragover','dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.add('dragover')));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.remove('dragover')));
dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(raw) {
    const okFiles = Array.from(raw).filter(f => /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name));
    
    const newItems = okFiles.map((file, index) => {
        const globalIndex = fileItems.length + index + 1;
        return {
            id: Date.now() + Math.random(),
            file: file,
            caption: `圖片 ${globalIndex}`,
            objectUrl: null 
        };
    });
    
    fileItems = [...fileItems, ...newItems].slice(0, 100); 
    
    fileItems.forEach(async item => {
        if (!item.objectUrl) item.objectUrl = await toObjectURL(item.file);
        renderPreview();
    });

    renderChips();
}

let dragStartIndex = null;
function renderChips() {
    fileChips.innerHTML = '';
    fileItems.forEach((item, i) => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.draggable = true;
        chip.innerHTML = `<span>${item.file.name}</span>
            <button class="chip-remove" onclick="removeFile(${i})">✕</button>`;

        // --- 優化後的拖曳排序事件 ---
        chip.addEventListener('dragstart', e => {
            dragStartIndex = i;
            chip.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        
        chip.addEventListener('dragend', () => {
            chip.classList.remove('dragging');
        });
        
        chip.addEventListener('dragover', e => {
            e.preventDefault();
            // 判斷滑鼠是在標籤的左半邊還是右半邊，決定指示器的位置
            const bounding = chip.getBoundingClientRect();
            const offset = e.clientX - bounding.left;
            if (offset > bounding.width / 2) {
                chip.classList.add('drag-over-right');
                chip.classList.remove('drag-over-left');
            } else {
                chip.classList.add('drag-over-left');
                chip.classList.remove('drag-over-right');
            }
        });

        chip.addEventListener('dragleave', e => {
            chip.classList.remove('drag-over-left', 'drag-over-right');
        });

        chip.addEventListener('drop', e => {
            e.preventDefault();
            chip.classList.remove('drag-over-left', 'drag-over-right');
            if (dragStartIndex === null || dragStartIndex === i) return;

            const bounding = chip.getBoundingClientRect();
            const offset = e.clientX - bounding.left;
            
            // 決定插入位置 (插在目標的前面或後面)
            let targetIndex = i;
            if (offset > bounding.width / 2) {
                targetIndex = i + 1;
            }

            const draggedItem = fileItems.splice(dragStartIndex, 1)[0];
            // 由於陣列少了一個元素，若原起點在目標前面，插入索引需減一
            if (dragStartIndex < targetIndex) targetIndex--; 
            
            fileItems.splice(targetIndex, 0, draggedItem);
            
            // 重新編排預設的圖片號碼
            fileItems.forEach((itm, idx) => {
                if(itm.caption.startsWith('圖片 ')) itm.caption = `圖片 ${idx + 1}`;
            });

            renderChips();
            renderPreview();
        });

        fileChips.appendChild(chip);
    });
    
    fileCount.textContent = fileItems.length 
        ? `共 ${fileItems.length} 張・預計 ${Math.ceil(fileItems.length / currentLayout)} 頁` 
        : '';
}

window.removeFile = i => {
    fileItems.splice(i, 1);
    fileItems.forEach((itm, idx) => {
        if(itm.caption.startsWith('圖片 ')) itm.caption = `圖片 ${idx + 1}`;
    });
    renderChips();
    renderPreview();
};

document.querySelectorAll('.layout-card').forEach(card => {
    card.addEventListener('click', () => {
        document.querySelectorAll('.layout-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        currentLayout = parseInt(card.dataset.layout);
        renderChips();
        renderPreview();
    });
});
enableCaptionCheck.addEventListener('change', renderPreview);
pdfTitleInput.addEventListener('input', renderPreview);

clearBtn.addEventListener('click', () => {
    fileItems = [];
    fileInput.value = '';
    renderChips();
    previewSection.style.display = 'none';
    previewPages.innerHTML = '';
    statusEl.textContent = '';
});

/* 預覽與編輯區 */
function renderPreview() {
    if (fileItems.length === 0) {
        previewSection.style.display = 'none';
        previewPages.innerHTML = '';
        return;
    }
    previewSection.style.display = 'block';
    
    const perPage = currentLayout;
    // 預覽幾何：與「產生 PDF」完全一致，達到所見即所得
    const PW = 210, PH = 297, MARGIN = 12, GAP = 8;
    const innerW = PW - MARGIN * 2;
    const cols = perPage === 2 ? 1 : 2;
    const rows = perPage === 6 ? 3 : 2;
    const cellW = (innerW - (cols - 1) * GAP) / cols;

    const pageCount = Math.ceil(fileItems.length / perPage);
    const title = pdfTitleInput.value.trim();
    const showCaption = enableCaptionCheck.checked;

    previewPages.innerHTML = '';
    
    for (let p = 0; p < pageCount; p++) {
        const slice = fileItems.slice(p * perPage, (p + 1) * perPage);
        const isFirstPage = (p === 0);
        // 首頁若有標題會佔用 16mm，與 PDF 一致
        const currentTitleH = (title && isFirstPage) ? 16 : 0;
        const totalH = PH - MARGIN * 2 - currentTitleH - (rows - 1) * GAP;
        const cellH = totalH / rows;
        // 圖說預留 8mm（與 PDF 一致），實際放圖區域為 cellH - captionReservedH
        const captionReservedH = showCaption ? 8 : 0;
        const targetBoxH = cellH - captionReservedH;
        
        const wrap = document.createElement('div');
        wrap.className = 'page-wrap';
        wrap.innerHTML = `<div class="page-number">P${p + 1}</div>`;

        const mock = document.createElement('div');
        mock.className = 'page-mock';

        // 標題只在第一頁顯示 (p === 0)
        if (title && isFirstPage) {
            const bar = document.createElement('div');
            bar.className = 'page-title-bar';
            bar.textContent = title;
            mock.appendChild(bar);
        }

        const grid = document.createElement('div');
        grid.className = 'page-imgs';
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        
        slice.forEach(item => {
            const container = document.createElement('div');
            container.className = 'img-container';

            const imgBox = document.createElement('div');
            imgBox.className = 'img-box';
            // 圖片格寬高比 = PDF 儲存格，使 contain 置中後的白邊與實際輸出相同
            imgBox.style.aspectRatio = (cellW / targetBoxH).toFixed(4);

            if (item.objectUrl) {
                const img = document.createElement('img');
                img.src = item.objectUrl;
                imgBox.appendChild(img);
            } else {
                imgBox.innerHTML = '<span style="color:#ccc; font-size:12px;">處理中...</span>';
            }
            container.appendChild(imgBox);

            if (showCaption) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'caption-input';
                input.value = item.caption;
                input.addEventListener('input', (e) => item.caption = e.target.value);
                container.appendChild(input);
            }
            grid.appendChild(container);
        });
        mock.appendChild(grid);

        const foot = document.createElement('div');
        foot.className = 'page-footer';
        foot.textContent = `PAGE ${p + 1} / ${pageCount}`;
        mock.appendChild(foot);
        wrap.appendChild(mock);
        previewPages.appendChild(wrap);
    }
}

async function toObjectURL(file) {
    if (/\.(heic|heif)$/i.test(file.name)) {
        try {
            const blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
            return URL.createObjectURL(blob);
        } catch(e) { return null; }
    }
    return URL.createObjectURL(file);
}

function textToPdfImage(text, fontSizePx, isBold = false) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const fontStr = `${isBold ? 'bold' : 'normal'} ${fontSizePx}px "Microsoft JhengHei", "微軟正黑體", sans-serif`;
    
    ctx.font = fontStr;
    const metrics = ctx.measureText(text);
    const w = Math.ceil(metrics.width);
    const h = fontSizePx * 1.4; 

    const scale = 4;
    canvas.width = (w + 4) * scale;
    canvas.height = h * scale;

    ctx.scale(scale, scale);
    ctx.font = fontStr;
    ctx.fillStyle = '#1a1a1a';
    ctx.textBaseline = 'top';
    ctx.fillText(text, 2, 2);

    return { 
        dataUrl: canvas.toDataURL('image/png'), 
        widthMm: w * 0.264583,
        heightMm: h * 0.264583 
    };
}

/* 產生 PDF */
generateBtn.addEventListener('click', async () => {
    if (fileItems.length === 0) return alert('請先選取圖片');

    generateBtn.disabled = true;
    statusEl.textContent = '準備中…';

    const title = pdfTitleInput.value.trim();
    const perPage = currentLayout;
    const showCaption = enableCaptionCheck.checked;

    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const PW = 210, PH = 297;
    const MARGIN = 12;
    const innerW = PW - MARGIN * 2;

    let cols = perPage === 2 ? 1 : 2;
    let rows = perPage === 6 ? 3 : 2;
    const GAP = 8;
    const cellW = (innerW - (cols - 1) * GAP) / cols;

    const pageCount = Math.ceil(fileItems.length / perPage);
    let firstPage = true;

    for (let p = 0; p < pageCount; p++) {
        statusEl.textContent = `產生第 ${p + 1} / ${pageCount} 頁…`;
        if (!firstPage) pdf.addPage();
        
        // 判斷是否為第一頁，動態分配標題空間
        const isFirstPage = firstPage;
        const currentTitleH = (title && isFirstPage) ? 16 : 0;   
        
        // 自動重新計算圖片可用高度 (非首頁可以放更大)
        const totalH = PH - MARGIN * 2 - currentTitleH - (rows - 1) * GAP;
        const cellH = totalH / rows;

        if (title && isFirstPage) {
            const titleImg = textToPdfImage(title, 24, true);
            const titleX = (PW - titleImg.widthMm) / 2;
            pdf.addImage(titleImg.dataUrl, 'PNG', titleX, MARGIN + 2, titleImg.widthMm, titleImg.heightMm);
            pdf.setDrawColor(30, 30, 30);
            pdf.setLineWidth(0.5);
            pdf.line(MARGIN, MARGIN + 12, PW - MARGIN, MARGIN + 12);
        }

        const slice = fileItems.slice(p * perPage, (p + 1) * perPage);

        for (let i = 0; i < slice.length; i++) {
            statusEl.textContent = `處理第 ${p * perPage + i + 1} / ${fileItems.length} 張…`;
            const col = i % cols;
            const row = Math.floor(i / cols);
            const boxX = MARGIN + col * (cellW + GAP);
            const boxY = MARGIN + currentTitleH + row * (cellH + GAP);

            try {
                const dataUrl = await fileToDataURL(slice[i].file);
                
                const imgObj = new Image();
                imgObj.src = dataUrl;
                await new Promise(r => imgObj.onload = r);
                
                const captionReservedH = showCaption ? 8 : 0; 
                const targetBoxH = cellH - captionReservedH;

                const imgRatio = imgObj.width / imgObj.height;
                const boxRatio = cellW / targetBoxH;
                
                let finalW, finalH;
                if (imgRatio > boxRatio) {
                    finalW = cellW;
                    finalH = cellW / imgRatio;
                } else {
                    finalH = targetBoxH;
                    finalW = targetBoxH * imgRatio;
                }

                const dx = boxX + (cellW - finalW) / 2;
                const dy = boxY + (targetBoxH - finalH) / 2;
                
                pdf.addImage(dataUrl, 'JPEG', dx, dy, finalW, finalH, undefined, 'MEDIUM');

                if (showCaption && slice[i].caption) {
                    const capImg = textToPdfImage(slice[i].caption, 14, false);
                    const finalCapW = Math.min(capImg.widthMm, cellW); 
                    const finalCapH = capImg.heightMm * (finalCapW / capImg.widthMm);
                    const capX = boxX + (cellW - finalCapW) / 2;
                    const capY = boxY + targetBoxH + 2; 
                    
                    pdf.addImage(capImg.dataUrl, 'PNG', capX, capY, finalCapW, finalCapH);
                }

            } catch(e) { console.error('Image error', e); }
        }

        pdf.setFontSize(9);
        pdf.setTextColor(150, 150, 150);
        pdf.text(`${p + 1} / ${pageCount}`, PW / 2, PH - 6, { align: 'center' });
        
        firstPage = false;
    }

    const filename = (title || 'images') + '.pdf';
    pdf.save(filename);
    statusEl.textContent = `✓ 下載完成：${filename}`;
    generateBtn.disabled = false;
});

async function fileToDataURL(file) {
    if (/\.(heic|heif)$/i.test(file.name)) {
        const blob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.92 });
        return blobToDataURL(blob);
    }
    return blobToDataURL(file);
}

function webpToPngBlob(file) {
    return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.naturalWidth; c.height = img.naturalHeight;
            c.getContext('2d').drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            c.toBlob(b => resolve(b || file), 'image/png');
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
    });
}

function blobToDataURL(blob) {
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(blob);
    });
}
